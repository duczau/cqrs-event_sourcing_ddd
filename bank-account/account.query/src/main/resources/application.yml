server:
  port: 5001

spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect
  datasource:
    url: jdbc:mysql://localhost:3306/techbank?useSSL=false&createDatabaseIfNotExist=true&serverTimezone=UTC
    username: user
    password: user
    driver-class-name: com.mysql.cj.jdbc.Driver

  kafka:
    listener: #Configure for Kafka listeners @KafkaListener
      ack-mode: MANUAL_IMMEDIATE
    consumer: #Configure for Kafka consumers @KafkaConsumer
      bootstrap-servers: localhost:9092
      group-id: bankaccConsumer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring:
          json:
            trusted:
              packages: "*"  # Allow all packages for JSON deserialization - be cautious in production, should be specific class need to deserialize
            # value:
            #   default:
            #     type: com.example.Order # Set default type for JSON deserialization if needed