version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.7
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log
    environment:
      # - ZOOKEEPER_SERVER_ID=1 # required if using multiple zookeeper servers
      - ZOOKEEPER_CLIENT_PORT=2181  # required
      - ZOOKEEPER_TICK_TIME=2000  # optional configure time for heartbeats and timeouts => determine session timeouts = tick time * tick sync limit
      - ZOOKEEPER_SYNC_LIMIT=2    # tick numbers for follower to sync with leader 

  kafka:
    image: confluentinc/cp-kafka:7.7.7
    ports:
      - "9092:9092"
      - "29092:29092"
    volumes:
      - kafka_data:/bitnami/
    environment:
      # - KAFKA_BROKER_ID=1 # required if using multiple servers
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_LISTENER=PLAINTEXT://:9092
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=false # optional (should have) Disable auto topic creation
    depends_on:
      - zookeeper

volumes:
  zookeeper_data:
    driver: local
  zookeeper_logs:
    driver: local
  kafka_data:
    driver: local

networks:
  default:
    external:
      name: techbankNet